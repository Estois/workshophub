name: Project Board Sync

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  move-to-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Find linked issue and move it to Done
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          OWNER: Estois
          PROJECT_NUMBER: 1
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail

          issue_number=$(echo "$PR_BODY" | grep -ioE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+(estois/workshophub)?#[0-9]+' | grep -oE '[0-9]+' | head -n1)

          if [ -z "$issue_number" ]; then
            echo "No 'Closes #N' reference found in PR body — nothing to sync."
            exit 0
          fi
          echo "Linked issue: #$issue_number"

          item_list_json=$(gh project item-list "$PROJECT_NUMBER" --owner "$OWNER" --format json)
          if [ $? -ne 0 ]; then
            echo "::error::gh project item-list failed — see output above. Not treating this as 'issue not on board'."
            exit 1
          fi

          item_id=$(echo "$item_list_json" \
            | jq -r --arg url "https://github.com/$OWNER/workshophub/issues/$issue_number" \
              '.items[] | select(.content.url == $url) | .id')

          if [ -z "$item_id" ]; then
            echo "Issue #$issue_number is not on project $PROJECT_NUMBER — nothing to sync."
            exit 0
          fi

          project_id=$(gh project view "$PROJECT_NUMBER" --owner "$OWNER" --format json | jq -r '.id')
          field_json=$(gh project field-list "$PROJECT_NUMBER" --owner "$OWNER" --format json)
          field_id=$(echo "$field_json" | jq -r '.fields[] | select(.name == "Status") | .id')
          done_option_id=$(echo "$field_json" | jq -r '.fields[] | select(.name == "Status") | .options[] | select(.name == "Done") | .id')

          if [ -z "$field_id" ] || [ -z "$done_option_id" ]; then
            echo "::error::Could not resolve Status field or Done option — check the project's Status field configuration."
            exit 1
          fi

          gh project item-edit --id "$item_id" --field-id "$field_id" --project-id "$project_id" --single-select-option-id "$done_option_id"
          echo "Moved issue #$issue_number to Done."
